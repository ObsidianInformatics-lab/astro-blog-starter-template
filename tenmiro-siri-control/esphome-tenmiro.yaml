# Option B: ESP32 + ESPHome BLE bridge for a Tenmiro/keepsmile (ELK-BLEDOM)
# LED strip.
#
# The ESP32 connects to the strip over Bluetooth and relays control to Home
# Assistant over Wi-Fi. From Home Assistant you enable the HomeKit Bridge,
# which makes the light appear in Apple's Home app -> full native Siri.
#
# Use this instead of Option A when your Home Assistant box is NOT physically
# near the light: the cheap ESP32 sits by the strip, HA can live anywhere.
#
# SETUP
#   1. Replace the MAC below with your strip's address (find it with the
#      bridge.py --scan tool, a BLE scanner app, or ESPHome's esp32_ble_tracker
#      logs). Format: AA:BB:CC:DD:EE:FF
#   2. Put your Wi-Fi + API/OTA secrets in ESPHome's secrets.yaml.
#   3. Flash to any ESP32 dev board, place it near the light, and add the
#      device in Home Assistant.
#
# NOTE: These controllers use unauthenticated writes to characteristic FFF3.
# Full RGB color is exposed below via a template light. If a unit ignores the
# FFF3 handle, try the FFE1 UUID instead (see ble_client write actions).

esphome:
  name: tenmiro-light

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# --- BLE plumbing ----------------------------------------------------------
esp32_ble_tracker:

ble_client:
  - mac_address: "AA:BB:CC:DD:EE:FF"   # <-- your strip's address
    id: strip

# Helper scripts that write the raw command bytes to the FFF3 characteristic.
script:
  - id: write_power
    parameters:
      on: bool
    then:
      - ble_client.ble_write:
          id: strip
          service_uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "0000fff3-0000-1000-8000-00805f9b34fb"
          value: !lambda |-
            if (on) return {0x7E,0x00,0x04,0xF0,0x00,0x01,0xFF,0x00,0xEF};
            return {0x7E,0x00,0x04,0x00,0x00,0x00,0xFF,0x00,0xEF};

  - id: write_rgb
    parameters:
      r: int
      g: int
      b: int
    then:
      - ble_client.ble_write:
          id: strip
          service_uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "0000fff3-0000-1000-8000-00805f9b34fb"
          value: !lambda |-
            return {0x7E,0x00,0x05,0x03,(uint8_t)r,(uint8_t)g,(uint8_t)b,0x00,0xEF};

  - id: write_brightness
    parameters:
      level: int   # 0-100
    then:
      - ble_client.ble_write:
          id: strip
          service_uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
          characteristic_uuid: "0000fff3-0000-1000-8000-00805f9b34fb"
          value: !lambda |-
            return {0x7E,0x00,0x01,(uint8_t)level,0x00,0x00,0x00,0x00,0xEF};

# --- The light entity Home Assistant (and Siri) sees -----------------------
# A template RGB light: ESPHome handles the on/off + color/brightness model,
# the output lambdas translate each change into the BLE writes above. The rgb
# platform scales the color components by brightness for us, so adjusting
# brightness in the Home app re-sends a dimmed color packet automatically.
#
# The three outputs receive red/green/blue (each 0.0-1.0); blue is written
# last, so we emit one combined color packet from its write_action.
output:
  - platform: template
    id: dummy_red
    type: float
    write_action:
      - lambda: id(_r) = (int)(state * 255);
  - platform: template
    id: dummy_green
    type: float
    write_action:
      - lambda: id(_g) = (int)(state * 255);
  - platform: template
    id: dummy_blue
    type: float
    write_action:
      - lambda: |-
          id(_b) = (int)(state * 255);
          id(write_rgb)->execute(id(_r), id(_g), id(_b));

light:
  - platform: rgb
    name: "Tenmiro Ceiling Strip"
    id: ceiling_strip
    red: dummy_red
    green: dummy_green
    blue: dummy_blue
    on_turn_on:
      - script.execute:
          id: write_power
          on: true
    on_turn_off:
      - script.execute:
          id: write_power
          on: false

globals:
  - id: _r
    type: int
    initial_value: "255"
  - id: _g
    type: int
    initial_value: "255"
  - id: _b
    type: int
    initial_value: "255"
